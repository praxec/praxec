# flow.tools.provision — Phase 2 of the MCP tool lifecycle
# (docs/design/2026-07-30-mcp-tool-lifecycle-phase2.md §3).
#
# Provisions a discovered `ToolCandidate` (Phase 1 `tool_catalog`) into a
# live praxec connection by COMPOSING praxec's own connection-governance
# CLI — it never writes `connections:` / `stagedConnections:` YAML itself:
#
#   staging  → `praxec connections add`   (STAGE: writes an inert, ungranted
#                                          connection body)
#   granting → `praxec connections grant` (GRANT: the separate, explicit,
#                                          auditable operator trust act)
#
# select → trust_gate ─┬─(verified/org)────────────────→ installing ─┐
#                       └─(community)──→ community_gate               ├→ collecting
#                                          ├─approve────────→ installing
#                                          └─decline→ failed
#        → collecting → building → staging → validating → granting → done | failed
#
# ── Phase 3 (P3.2) — the community lane, double-approved ────────────────
# `trust_gate` no longer refuses `community` candidates. It routes them
# through ONE extra operator gate (`community_gate` — "yes, I understand
# this is unverified/third-party and I accept the risk of installing it")
# before they reach the SAME `installing` state a verified/org candidate
# does. Net: community gets TWO operator approvals (`community_gate` then
# `granting`); verified/org get the one (`granting`) they always had.
#
# `installing` DELEGATES to the one installer (`praxec tools install <id>`
# → `ProvisionInstaller`), which obtains a checksum-verified prebuilt
# binary (release provider) or a pulled image (docker provider) — it never
# runs a package's arbitrary install scripts. That is why the community
# lane no longer needs a per-step sandbox (the old hash-pinned,
# `confinement: "confined"` community package-manager install script is
# gone): there is no untrusted code execution to confine at install time.
# The extra `community_gate` approval, not a sandbox, is the community-tier
# control; `granting` remains the ONE final
# activation gate for EVERY tier.
#
# ── The env-wiring gap (P2.3b) — CLOSED, here's exactly how ─────────────
# `staging` used to template only the CONNECTION IDENTITY (name / kind /
# command-or-url) from the candidate — never the elicited secrets/config —
# because a `kind: cli` step's `args:` is a STATIC JSON array (see
# `crates/praxec-executors/src/cli.rs` + `arg_render.rs`): each element
# resolves to exactly ONE argv token via a whole-value path read or a
# literal, with no loop/spread construct to expand one array-valued
# context field (`candidate.requires.secrets`, arbitrary length) into N
# repeated `--env NAME=VALUE` tokens. That grammar limit is real and
# still true — it's just no longer the blocker, because the fix does not
# route through repeated flags at all:
#
#   1. `building` (new) runs a `kind: script` step (`build.connection-body`,
#      below) that reads `secretEnvNames`/`collectedConfig` — both
#      ARBITRARY-length JSON, not CLI argv — and emits ONE JSON object:
#      the full connection body, `env:`/`required_secrets:` included. This
#      needed a real code component (jq) — `arg_render.rs`'s whole-path
#      reads and the guard/output-mapping operators have no loop/length()
#      construct either, so the arity problem genuinely can't be solved
#      declaratively (confirmed while building this).
#   2. That body lands in ONE context slot (`built_body`) as a JSON object
#      — `render_arg`'s whole-value-path fallback (`other.to_string()`)
#      compact-serializes an object-valued context field to a single argv
#      token, so `staging` passes the WHOLE body as one templated
#      `--block` token to `connections add --block` (P2.3b's new CLI
#      flag — see `crates/praxec-executors/src/conn_write.rs`).
#
# Collected values are wired as TWO different kinds, deliberately:
#   - `collectedConfig` (non-secret) → literal `env:` entries. Safe to put
#     in the config: the operator already typed these into the elicitation
#     form and they carry no secret material.
#   - `secretEnvNames[].envVar` (secret) → `required_secrets:` NAMES only,
#     never values. This is NOT a templating shortcut — it's how connection
#     secrets ACTUALLY resolve in this codebase: `std::process::Command`
#     inherits the current process environment by default (see
#     `crates/praxec-executors/src/cli.rs`/`mcp.rs`), so a spawned child
#     already sees whatever the operator exported in their own shell before
#     running `praxec`; `required_secrets:` is a pure DECLARATION that lets
#     `praxec doctor`/preflight report a missing one (advisory — see
#     `crates/praxec/src/preflight.rs`). Writing the secret's actual VALUE
#     (or a `"$NAME"`-style placeholder string) into `env:` would be
#     actively wrong: `cmd.env(k, v)` sets that key VERBATIM on the child,
#     which would SHADOW the correctly-inherited real secret with a literal
#     placeholder string instead of resolving it.
#   - This is P2.1's `required_secrets` field; it was already read by
#     `preflight.rs`/`doctor` but, until this change, absent from
#     `schemas/gateway-config.schema.json`'s `mcpConnection` def
#     (`additionalProperties: false` with no such property) — so granting
#     a connection that declared it always failed `INVALID_STAGED_CONNECTION`
#     schema validation. That schema gap is what this program closed; see
#     the `required_secrets` entry added there.
#
# Candidates with empty `requires` (the common case — see
# `crates/praxec-core/src/tool_catalog/candidate.rs`'s own doc comment)
# provision exactly as before: `built_body` just has no `env:`/
# `required_secrets:` keys.
#
# Transport coverage: `installing` is exhaustive over the closed transport
# enum — `stdio`/`docker` DELEGATE the local install to `praxec tools
# install` (the installer resolves the release → docker → npx → cargo chain
# internally), while `remote→mcp+url` / `rest→rest` need nothing installed
# (noop). `building` then assembles a connection body for all four transports
# the closed enum names. The `stdio` lane splits by SOURCE: an npm-distributed
# server (`ToolSource::Npm`, A5's `Provider::Npx` no-op-install path — nothing
# is placed on PATH, npx fetches on run) wires `{command:"npx", args:["-y",
# <pkg>]}`; a plain binary source wires `{command:<installed-binary>}`. The
# `docker` recipe wires the pulled image as a `docker run --rm -i <image>`
# stdio-over-mcp command from the ref the candidate carries
# (`source.image.image`, projected to `dockerImage` in `select`).
#
# The docker image ref MUST be pinned (a `:tag` or `@digest`) — this is
# ENFORCED, not assumed. `installing` `docker pull`s the image PINNED
# (`docker pull <image>:<version>`), so `docker run <image>` on an UNPINNED
# ref would resolve `:latest` at spawn — a DIFFERENT, unpinned image than was
# pulled/validated. A `ToolCandidate` carries no registry `version` to append,
# so the `docker` recipe FAILS FAST (`BUILD_REQUIRES_PINNED_IMAGE` → `failed`)
# on an unpinned ref rather than wire it. Otherwise every lane shares the same
# identity/env/required_secrets structure; only the argv head differs.

# Lexicon entry for the one script subject this workflow defines (SPEC §30.10.4).
lexicon:
  build.connection-body:
    definition_short: >
      Assemble a staged connection's full JSON body (kind, identity,
      env:/required_secrets:) from a candidate + operator-collected values.

scripts:
  build.connection-body:
    verb: build
    lifecycle: stable
    body: |
      #!/usr/bin/env bash
      set -euo pipefail

      transport="$1"
      # For the stdio lane this is the tool's COMMAND (the installed release
      # binary's name) — the same identity `praxec tools install <id>` places on
      # PATH. (remote/rest lanes ignore this positional; they wire `url`.)
      command="$2"
      source_url="$3"
      secret_env_names_json="$4"
      collected_config_json="$5"

      # `secretEnvNames` is `[{name, envVar}, ...]` (P2.3b's `collecting`
      # output) — only the envVar NAMES are needed here, never a value.
      required_secrets=$(echo "$secret_env_names_json" | jq -c '[ .[].envVar ]')

      # `restConnection`'s schema has no `env:` (or `required_secrets:`)
      # property — only `mcpConnection` gained `required_secrets:` (P2.3b).
      # A rest-transport candidate that actually declared `requires` has
      # nowhere safe to put the collected values today (its secret/config
      # would need to land in `headers:`, a different, un-elicited-for-here
      # mechanism) — fail fast rather than silently dropping them.
      has_requires=$(jq -n --argjson secrets "$required_secrets" --argjson cfg "$collected_config_json" \
        '($secrets|length) > 0 or ($cfg|length) > 0')

      case "$transport" in
        stdio)
          # Wire the INSTALLED release binary as the connection body — its
          # `command` is what `praxec tools install <id>` placed on PATH. This
          # lane is a PLAIN binary source only: an npm-distributed stdio server
          # (`ToolSource::Npm`, the A5 `Provider::Npx` no-op-install path) is
          # NOT placed on PATH and is routed by `building` to the `npx)` case
          # below instead — never wired as a bare command here.
          jq -nc \
            --arg cmd "$command" \
            --argjson secrets "$required_secrets" \
            --argjson cfg "$collected_config_json" \
            '{kind:"mcp", command:$cmd}
             + (if ($cfg|length) > 0 then {env:($cfg | with_entries(.value |= tostring))} else {} end)
             + (if ($secrets|length) > 0 then {required_secrets:$secrets} else {} end)'
          ;;
        npx)
          # An npm-source stdio candidate (`ToolSource::Npm{pkg}`) — A5's
          # `Provider::Npx` no-op install: nothing is placed on PATH because npx
          # fetches the package on run, so the connection MUST be `npx -y <pkg>`,
          # never a bare command that isn't installed. Here `$command` ($2)
          # carries the npm package (`candidate.source.npm.pkg`, projected to
          # `npmPkg` in `select`). env:/required_secrets: assembly is identical
          # to the other mcp lanes; only the argv (`npx -y <pkg>`) differs.
          jq -nc \
            --arg pkg "$command" \
            --argjson secrets "$required_secrets" \
            --argjson cfg "$collected_config_json" \
            '{kind:"mcp", command:"npx", args:["-y",$pkg]}
             + (if ($cfg|length) > 0 then {env:($cfg | with_entries(.value |= tostring))} else {} end)
             + (if ($secrets|length) > 0 then {required_secrets:$secrets} else {} end)'
          ;;
        docker)
          # `installing` already `docker pull`ed the image PINNED
          # (`docker pull <image>:<version>`); wire it as a `docker run`
          # stdio-over-mcp command. For this lane the `command` positional ($2)
          # carries the image reference (`source.image.image`), the same slot the
          # stdio lane uses for the release binary's name — so the
          # env:/required_secrets: assembly is identical; only the argv head
          # (`docker run --rm -i <image>`) differs.
          #
          # Poka-yoke — a governed docker connection MUST run the EXACT image
          # that was pulled/validated. `docker run <image>` with an UNPINNED ref
          # resolves `:latest` at spawn, a different, unpinned tag than the
          # installer pulled. Discovery's `mcp_registry` adapter often sets
          # `ToolSource::Image{image:<pkg-name>}` with NO tag, and a
          # `ToolCandidate` carries no registry `version` we could append — so
          # rather than silently wire an unpinned image, require the ref to carry
          # a `:tag` or `@digest` on its final path component and FAIL FAST
          # (→ `failed`) if it does not. `${image##*/}` strips any
          # `registry[:port]/…/` prefix so a host port is never mistaken for a tag.
          image="$command"
          ref_tail="${image##*/}"
          case "$ref_tail" in
            *@*|*:*) : ;;  # pinned: `@digest` or `:tag` on the final component.
            *)
              echo "BUILD_REQUIRES_PINNED_IMAGE: docker candidate image '$image' is not pinned (needs :tag or @digest) — a governed docker connection must run the exact image that was pulled/validated" >&2
              exit 1
              ;;
          esac
          jq -nc \
            --arg image "$image" \
            --argjson secrets "$required_secrets" \
            --argjson cfg "$collected_config_json" \
            '{kind:"mcp", command:"docker", args:["run","--rm","-i",$image]}
             + (if ($cfg|length) > 0 then {env:($cfg | with_entries(.value |= tostring))} else {} end)
             + (if ($secrets|length) > 0 then {required_secrets:$secrets} else {} end)'
          ;;
        remote)
          jq -nc \
            --arg url "$source_url" \
            --argjson secrets "$required_secrets" \
            --argjson cfg "$collected_config_json" \
            '{kind:"mcp", url:$url}
             + (if ($cfg|length) > 0 then {env:($cfg | with_entries(.value |= tostring))} else {} end)
             + (if ($secrets|length) > 0 then {required_secrets:$secrets} else {} end)'
          ;;
        rest)
          if [ "$has_requires" = "true" ]; then
            echo "BUILD_RECIPE_UNAVAILABLE: rest transport has no env:/required_secrets: analog — this candidate declared requires.secrets/requires.config, which this reference workflow cannot wire for a rest connection" >&2
            exit 1
          fi
          jq -nc --arg url "$source_url" '{kind:"rest", baseUrl:$url}'
          ;;
        *)
          # Dead code today — `building`'s guards route stdio/remote/rest
          # before this script ever runs; kept as a defensive fail-fast in
          # case a future guard change lets an unhandled transport through.
          echo "BUILD_RECIPE_UNAVAILABLE: unsupported transport '$transport'" >&2
          exit 1
          ;;
      esac

workflows:
  flow.tools.provision:
    description: >
      Provision a discovered MCP tool candidate into a live connection via
      the existing `connections add` (stage) → `connections grant`
      (operator trust act) CLI. Verified/org candidates install directly;
      `community` (unverified/third-party) candidates are no longer
      refused — they take an extra operator-approved detour through
      `community_gate` (Phase 3 / P3.2) before reaching the same
      `installing` and collect → validate → grant path every tier shares.
    tags: [tool-lifecycle, governed, phase2, phase3-community-lane]

    inputSchema:
      type: object
      required: [candidate, config_path]
      additionalProperties: false
      properties:
        candidate:
          type: object
          description: A `ToolCandidate` (Phase 1 `tool_catalog`) — by value.
          required: [name, transport, source, trust_tier]
          additionalProperties: false
          properties:
            name: { type: string }
            description: { type: string, default: "" }
            transport:
              type: string
              enum: [stdio, docker, remote, rest]
            source:
              type: object
              description: >
                The `ToolSource` tagged union, e.g. `{ npm: { pkg: "..." } }`
                or `{ url: { url: "..." } }`. Kept loose here (Phase 1's
                type is the source of truth); the states below read only
                the shapes they support.
            verbs: { type: array, items: { type: string }, default: [] }
            tags: { type: array, items: { type: string }, default: [] }
            trust_tier:
              type: string
              enum: [community, org, verified]
            requires:
              type: object
              default: { secrets: [], config: [] }
              additionalProperties: false
              properties:
                secrets:
                  type: array
                  default: []
                  items:
                    type: object
                    required: [name, description]
                    properties:
                      name: { type: string }
                      description: { type: string }
                config:
                  type: array
                  default: []
                  items:
                    type: object
                    required: [name, description]
                    properties:
                      name: { type: string }
                      description: { type: string }
            provenance: { type: string, default: "" }
        config_path:
          type: string
          description: The gateway YAML config to stage/grant the connection into.

    initialState: select

    # Every field any state's output touches is seeded here — no state's
    # first read of a slot is ever an unset-context-slot guard error.
    initialContext:
      candidate: null
      name: null
      transport: null
      trust_tier: null
      secrets_required: []
      config_required: []
      config_path: null
      npmPkg: null
      sourceUrl: null
      dockerImage: null
      secretEnvNames: []
      collectedConfig: {}
      secrets_set: []
      community_approved: null
      installExitCode: null
      installSuccess: null
      built_body: null
      buildExitCode: null
      buildSuccess: null
      stageExitCode: null
      stageSuccess: null
      doctorExitCode: null
      doctorSuccess: null
      doctorStdout: null
      grantExitCode: null
      grantSuccess: null
      connection_name: null
      wired: false
      reason: null

    states:

      # ── select ──────────────────────────────────────────────────────
      select:
        description: >
          Resolve/normalize the input candidate into the flat fields the
          later states read. Pure data projection (`kind: noop` executor)
          — every read here is null-safe (output-mapping path reads
          coalesce to `null` when the candidate's `source` variant doesn't
          have that shape), so branching on the result is never a guard
          crash.
        onEnter:
          executor: { kind: noop }
          output:
            candidate:        "$.workflow.input.candidate"
            name:             "$.workflow.input.candidate.name"
            transport:        "$.workflow.input.candidate.transport"
            trust_tier:       "$.workflow.input.candidate.trust_tier"
            secrets_required: "$.workflow.input.candidate.requires.secrets"
            config_required:  "$.workflow.input.candidate.requires.config"
            config_path:      "$.workflow.input.config_path"
            # Source-variant projections — null unless that variant is
            # actually present (see the header note on why this is safe).
            npmPkg:      "$.workflow.input.candidate.source.npm.pkg"
            sourceUrl:   "$.workflow.input.candidate.source.url.url"
            dockerImage: "$.workflow.input.candidate.source.image.image"
        transitions:
          resolved:
            title: Candidate resolved — evaluate trust tier.
            target: trust_gate

      # ── trust_gate ──────────────────────────────────────────────────
      trust_gate:
        description: >
          Split gate on `trust_tier`. Exhaustive over the closed
          `TrustTier` set (community/org/verified) rather than one
          unguarded catch-all transition, so `linkFilter: byGuards` never
          shows two simultaneously-legal outcomes. `community` no longer
          fails closed here (Phase 3 / P3.2) — it routes to `community_gate`,
          an extra operator approval that precedes a SANDBOXED install
          (see the workflow header note), then rejoins the normal path.
        linkFilter: byGuards
        transitions:
          # `proceed_verified`/`proceed_org` are split into two flat-guard
          # transitions (rather than one `any_of`) so each is independently
          # coverable by `praxec fuzz`'s satisfier, which only derives a
          # satisfying value for a top-level `expr` guard, not a composite
          # `any_of`/`all_of`/`not` — same reason as `expense-approval`'s
          # permission-guarded edges show as uncoverable there.
          proceed_verified:
            title: Verified tier — proceed to install.
            target: installing
            guards:
              - { kind: expr, expr: "$.context.trust_tier == 'verified'" }

          proceed_org:
            title: Org tier — proceed to install.
            target: installing
            guards:
              - { kind: expr, expr: "$.context.trust_tier == 'org'" }

          proceed_community:
            title: Community tier — extra approval, then a SANDBOXED install.
            target: community_gate
            guards:
              - { kind: expr, expr: "$.context.trust_tier == 'community'" }

          reject_unknown_tier:
            title: Unrecognized/unset trust tier — fail closed.
            target: failed
            guards:
              - kind: all_of
                guards:
                  - { kind: expr, expr: "$.context.trust_tier != 'verified'" }
                  - { kind: expr, expr: "$.context.trust_tier != 'org'" }
                  - { kind: expr, expr: "$.context.trust_tier != 'community'" }
            output:
              reason: "UNKNOWN_TRUST_TIER"

      # ── community_gate ──────────────────────────────────────────────
      community_gate:
        description: >
          Phase 3 (P3.2) — the extra approval untrusted/unverified code
          requires. `trust_gate` routes here ONLY for `trust_tier ==
          'community'`; before any of the candidate's install code runs,
          the operator must see plainly that this is an unverified,
          third-party tool and explicitly accept running its install
          SANDBOXED. This is distinct from `granting` (below), which still
          gates ACTIVATION for every tier — approving here only permits
          `installing` to run for this candidate; the tool is not wired until
          `granting` ALSO approves it. Community tools thus clear TWO
          operator gates; verified/org clear the one (`granting`).
        linkFilter: byGuards
        transitions:
          approve_community_install:
            title: Approve — install this UNVERIFIED tool.
            actor: human
            target: installing
            guards:
              - { kind: permission, permission: workflow.approve }
            output:
              community_approved: true

          decline_community_install:
            title: Decline — do not install. Nothing runs.
            actor: human
            target: failed
            guards:
              - { kind: permission, permission: workflow.approve }
            output:
              community_approved: false
              reason: "COMMUNITY_DECLINED"

      # ── installing ──────────────────────────────────────────────────
      installing:
        description: >
          DELEGATE the install to the ONE installer via `praxec tools
          install <id>` (a `kind: cli` step is the only way a YAML workflow
          can reach the Rust `ProvisionInstaller`). The installer resolves
          the release → docker → npx → cargo provider chain, checksum-verifies a
          downloaded binary, and places it — so this workflow no longer
          carries a per-transport install recipe (the old package-manager
          special case and the unsupported-transport dead-end are gone). Exhaustive over the closed transport enum: `stdio`/`docker`
          need a local install (delegate); `remote`/`rest` need nothing
          installed (noop). Bounded by `reliability.timeoutMs`; a non-zero
          exit is DATA (`treatNonZeroAsFailure: false`) so `branches` — not
          an executor error — routes a real `INSTALL_FAILED` to `failed`.
          This is the SAME state a community-tier candidate reaches after
          `community_gate` approves it — one install path, two governance
          routes to it (no parallel abstraction).
        linkFilter: byGuards
        transitions:
          # stdio + docker each DELEGATE the local install to the one
          # installer. Split into two flat single-`expr`-guard transitions
          # (rather than one `any_of`) so each is independently coverable by
          # `praxec fuzz`'s satisfier — same reason `trust_gate`'s
          # `proceed_verified`/`proceed_org` are split.
          install_stdio:
            title: "Install (stdio): delegate to `praxec tools install <id>`."
            target: failed # fallback if the branch below doesn't match
            guards:
              - { kind: expr, expr: "$.context.transport == 'stdio'" }
            executor:
              kind: cli
              connection: praxec
              args:
                - "tools"
                - "install"
                - "--config"
                - "$.context.config_path"
                - "$.context.name"
              treatNonZeroAsFailure: false
            reliability:
              timeoutMs: 120000
            branches:
              - when: { kind: expr, expr: "$.context.installSuccess == true" }
                target: collecting
            output:
              installExitCode: "$.output.exitCode"
              installSuccess:  "$.output.success"
              reason: "INSTALL_FAILED"

          install_docker:
            title: "Install (docker): delegate to `praxec tools install <id>`."
            target: failed # fallback if the branch below doesn't match
            guards:
              - { kind: expr, expr: "$.context.transport == 'docker'" }
            executor:
              kind: cli
              connection: praxec
              args:
                - "tools"
                - "install"
                - "--config"
                - "$.context.config_path"
                - "$.context.name"
              treatNonZeroAsFailure: false
            reliability:
              timeoutMs: 120000
            branches:
              - when: { kind: expr, expr: "$.context.installSuccess == true" }
                target: collecting
            output:
              installExitCode: "$.output.exitCode"
              installSuccess:  "$.output.success"
              reason: "INSTALL_FAILED"

          install_not_needed_remote:
            title: "Install: remote transport needs nothing installed."
            target: collecting
            guards:
              - { kind: expr, expr: "$.context.transport == 'remote'" }
            executor: { kind: noop }
            output:
              installSuccess: true

          install_not_needed_rest:
            title: "Install: rest transport needs nothing installed."
            target: collecting
            guards:
              - { kind: expr, expr: "$.context.transport == 'rest'" }
            executor: { kind: noop }
            output:
              installSuccess: true

      # ── collecting ──────────────────────────────────────────────────
      collecting:
        description: >
          Elicit `candidate.requires.secrets` + `requires.config` from the
          operator. Secrets are recorded as env-var NAMES the operator has
          already set in `providers.env` — never values — so no secret
          material ever reaches this workflow's context or audit trail.
          Arbitrary-length lists are fine here: this is JSON data capture,
          not CLI argv (see the header note on why `staging` can't turn
          this into repeated `--env` flags today).
        transitions:
          # NOTE: `praxec check` warns ELICITATION_INCOMPATIBLE_GATE here
          # (V36) — `secretEnvNames`/`config` are non-primitive, so a
          # chat-style push-elicitation UI could never fill this form. That
          # is the intended shape: this is a PULL-ONLY gate (V36 explicitly
          # allows it — "pull-only object gates are legitimate"), resolved
          # by the operator submitting the full JSON directly (`command
          # submit` / `approvals resolve`), not by a primitives-only push
          # form. `choices:` doesn't fit — there is no finite pick-list;
          # the operator is naming arbitrary env-var mappings.
          submit_collection:
            title: Submit the operator's secret-name / config mapping.
            actor: human
            target: building
            executor:
              kind: human
              queue: tool-provision-collect
            inputSchema:
              type: object
              required: [secretEnvNames, config]
              additionalProperties: false
              properties:
                secretEnvNames:
                  type: array
                  default: []
                  description: >
                    One entry per `candidate.requires.secrets` item: which
                    env-var NAME (already set in `providers.env`) backs it.
                  items:
                    type: object
                    required: [name, envVar]
                    additionalProperties: false
                    properties:
                      name:   { type: string, description: "requires.secrets[].name this answers." }
                      envVar: { type: string, description: "The env-var NAME in providers.env (never its value)." }
                config:
                  type: object
                  default: {}
                  description: Values for `candidate.requires.config` fields.
            output:
              secretEnvNames:  "$.arguments.secretEnvNames"
              collectedConfig: "$.arguments.config"
              secrets_set:     "$.arguments.secretEnvNames[*].envVar"

      # ── building ────────────────────────────────────────────────────
      building:
        description: >
          P2.3b — build the FULL staged-connection body (identity +
          `env:`/`required_secrets:`) in one `kind: script` step, from the
          candidate's transport/source AND the operator's collected
          secrets/config — see the header note for why this needed a real
          code component and why secrets land as `required_secrets:` names
          rather than `env:` values. A non-zero exit is data
          (`treatNonZeroAsFailure: false`); `branches` decides the route so
          `BUILD_FAILED` lands correctly in `failed`. The
          transport/source-availability guards mirror `installing`'s —
          checked BEFORE spawning anything, so an unsupported combination
          never reaches the script at all.
        linkFilter: byGuards
        transitions:
          # The stdio transport splits by SOURCE: an npm-distributed server
          # (A5's `Provider::Npx` no-op-install path) must run `npx -y <pkg>`
          # because nothing was placed on PATH; a plain binary source keeps its
          # installed `command`. Split into two flat single-`expr`-guard-list
          # transitions (mutually exclusive on `npmPkg`) — same shape as the
          # docker+image split, so `linkFilter: byGuards` never shows two
          # simultaneously-legal outcomes and `praxec fuzz`'s satisfier covers
          # each independently.
          build_stdio_npx:
            title: "Build: stdio mcp connection body (npm source → `npx -y <pkg>`)."
            target: failed
            guards:
              - { kind: expr, expr: "$.context.transport == 'stdio'" }
              - { kind: expr, expr: "$.context.npmPkg != null" }
            executor:
              kind: script
              subject: build.connection-body
              args:
                - "npx"
                - "$.context.npmPkg"
                - "$.context.sourceUrl"
                - "$.context.secretEnvNames"
                - "$.context.collectedConfig"
              treatNonZeroAsFailure: false
            branches:
              - when: { kind: expr, expr: "$.context.buildSuccess == true" }
                target: staging
            output:
              buildExitCode: "$.output.exitCode"
              buildSuccess:  "$.output.success"
              built_body:    "$.output.json"
              reason: "BUILD_FAILED"

          build_stdio_mcp:
            title: "Build: stdio mcp connection body (installed release binary)."
            target: failed
            # Plain binary source (`npmPkg == null`): `installing` already placed
            # the release binary (release/docker/npx/cargo chain), so the
            # connection body wires that binary's COMMAND (`$.context.name`, the
            # id `praxec tools install` used), not a package spec. The npm source
            # is handled by `build_stdio_npx` above (→ `npx -y <pkg>`).
            guards:
              - { kind: expr, expr: "$.context.transport == 'stdio'" }
              - { kind: expr, expr: "$.context.npmPkg == null" }
            executor:
              kind: script
              subject: build.connection-body
              args:
                - "stdio"
                - "$.context.name"
                - "$.context.sourceUrl"
                - "$.context.secretEnvNames"
                - "$.context.collectedConfig"
              treatNonZeroAsFailure: false
            branches:
              - when: { kind: expr, expr: "$.context.buildSuccess == true" }
                target: staging
            output:
              buildExitCode: "$.output.exitCode"
              buildSuccess:  "$.output.success"
              built_body:    "$.output.json"
              reason: "BUILD_FAILED"

          build_docker_mcp:
            title: "Build: docker mcp connection body (`docker run` the pulled image)."
            target: failed
            # `installing` already `docker pull`ed the image PINNED via the one
            # installer; the connection body wires it as a `docker run --rm -i
            # <image>` stdio-over-mcp command. `dockerImage` is the image ref the
            # candidate carries (`source.image.image`), projected in `select`. The
            # recipe ENFORCES that ref is pinned (`:tag`/`@digest`) — an unpinned
            # image fails fast with `BUILD_REQUIRES_PINNED_IMAGE` (→ `failed`), so
            # a governed connection can never `docker run` a `:latest` it didn't pull.
            guards:
              - { kind: expr, expr: "$.context.transport == 'docker'" }
              - { kind: expr, expr: "$.context.dockerImage != null" }
            executor:
              kind: script
              subject: build.connection-body
              args:
                - "docker"
                - "$.context.dockerImage"
                - "$.context.sourceUrl"
                - "$.context.secretEnvNames"
                - "$.context.collectedConfig"
              treatNonZeroAsFailure: false
            branches:
              - when: { kind: expr, expr: "$.context.buildSuccess == true" }
                target: staging
            output:
              buildExitCode: "$.output.exitCode"
              buildSuccess:  "$.output.success"
              built_body:    "$.output.json"
              reason: "BUILD_FAILED"

          build_remote_mcp:
            title: "Build: remote (streamable-http) mcp connection body."
            target: failed
            guards:
              - { kind: expr, expr: "$.context.transport == 'remote'" }
              - { kind: expr, expr: "$.context.sourceUrl != null" }
            executor:
              kind: script
              subject: build.connection-body
              args:
                - "remote"
                - "$.context.npmPkg"
                - "$.context.sourceUrl"
                - "$.context.secretEnvNames"
                - "$.context.collectedConfig"
              treatNonZeroAsFailure: false
            branches:
              - when: { kind: expr, expr: "$.context.buildSuccess == true" }
                target: staging
            output:
              buildExitCode: "$.output.exitCode"
              buildSuccess:  "$.output.success"
              built_body:    "$.output.json"
              reason: "BUILD_FAILED"

          build_rest:
            title: "Build: rest connection body."
            target: failed
            guards:
              - { kind: expr, expr: "$.context.transport == 'rest'" }
              - { kind: expr, expr: "$.context.sourceUrl != null" }
            executor:
              kind: script
              subject: build.connection-body
              args:
                - "rest"
                - "$.context.npmPkg"
                - "$.context.sourceUrl"
                - "$.context.secretEnvNames"
                - "$.context.collectedConfig"
              treatNonZeroAsFailure: false
            branches:
              - when: { kind: expr, expr: "$.context.buildSuccess == true" }
                target: staging
            output:
              buildExitCode: "$.output.exitCode"
              buildSuccess:  "$.output.success"
              built_body:    "$.output.json"
              reason: "BUILD_FAILED"

          build_unsupported:
            title: No build recipe for this transport/source combination.
            target: failed
            guards:
              - kind: all_of
                guards:
                  # stdio always has a build recipe now — npm source →
                  # `npx -y <pkg>` (`build_stdio_npx`), else installed binary →
                  # mcp command (`build_stdio_mcp`); only a non-stdio transport
                  # can fall through here.
                  - { kind: expr, expr: "$.context.transport != 'stdio'" }
                  - kind: not
                    guard:
                      kind: all_of
                      guards:
                        - { kind: expr, expr: "$.context.transport == 'docker'" }
                        - { kind: expr, expr: "$.context.dockerImage != null" }
                  - kind: not
                    guard:
                      kind: all_of
                      guards:
                        - { kind: expr, expr: "$.context.transport == 'remote'" }
                        - { kind: expr, expr: "$.context.sourceUrl != null" }
                  - kind: not
                    guard:
                      kind: all_of
                      guards:
                        - { kind: expr, expr: "$.context.transport == 'rest'" }
                        - { kind: expr, expr: "$.context.sourceUrl != null" }
            output:
              reason: "BUILD_RECIPE_UNAVAILABLE"

      # ── staging ─────────────────────────────────────────────────────
      staging:
        description: >
          Stage the connection (inert, ungranted) via `praxec connections
          add --block`: `built_body` already carries the resolved `kind`
          (mcp/rest) and every field, so ONE ungated transition covers all
          transports — no more per-kind duplication. A non-zero exit is
          data (`treatNonZeroAsFailure: false`); `branches` decides the
          route so `STAGE_FAILED` lands correctly in `failed`.
        transitions:
          stage_connection:
            title: "Stage: `connections add --block` with the built body."
            target: failed
            executor:
              kind: cli
              connection: praxec
              args:
                - "connections"
                - "add"
                - "--config"
                - "$.context.config_path"
                - "--name"
                - "$.context.name"
                - "--block"
                - "$.context.built_body"
              treatNonZeroAsFailure: false
            branches:
              - when: { kind: expr, expr: "$.context.stageSuccess == true" }
                target: validating
            output:
              stageExitCode: "$.output.exitCode"
              stageSuccess:  "$.output.success"
              reason: "STAGE_FAILED"

      # ── validating ──────────────────────────────────────────────────
      validating:
        description: >
          Doctor-check the staged connection (P2.1's `required_secrets`
          check) BEFORE anything is granted — the poka-yoke: a tool never
          reaches the live registry until its secrets resolve.
        transitions:
          validate:
            title: Run `praxec doctor` against the staged connection.
            target: failed
            executor:
              kind: cli
              connection: praxec
              args: ["doctor", "--config", "$.context.config_path"]
              treatNonZeroAsFailure: false
            reliability:
              timeoutMs: 30000
            branches:
              - when: { kind: expr, expr: "$.context.doctorSuccess == true" }
                target: granting
            output:
              doctorExitCode: "$.output.exitCode"
              doctorSuccess:  "$.output.success"
              doctorStdout:   "$.output.stdout"
              reason: "VALIDATION_FAILED"

      # ── granting ────────────────────────────────────────────────────
      granting:
        description: >
          THE operator trust act: `praxec connections grant`. This is a
          human gate — in a headless drive it parks for the operator
          exactly like any other `actor: human` transition; approving it
          here IS the proven-human origin, so the composed CLI call passes
          `--yes` (a non-interactive grant is otherwise refused fail-closed
          with `GRANT_REQUIRES_OPERATOR` — see `gateway.rs`). Declining
          never invokes the CLI at all — nothing is granted.
        linkFilter: byGuards
        transitions:
          approve_grant:
            title: Approve — grant the staged connection.
            actor: human
            target: failed
            guards:
              - { kind: permission, permission: workflow.approve }
            executor:
              kind: cli
              connection: praxec
              args:
                - "connections"
                - "grant"
                - "--config"
                - "$.context.config_path"
                - "$.context.name"
                - "--yes"
              treatNonZeroAsFailure: false
            branches:
              - when: { kind: expr, expr: "$.context.grantSuccess == true" }
                target: done
            output:
              grantExitCode: "$.output.exitCode"
              grantSuccess:  "$.output.success"
              reason: "GRANT_FAILED"

          decline_grant:
            title: Decline — do not grant. Nothing is wired.
            actor: human
            target: failed
            guards:
              - { kind: permission, permission: workflow.approve }
            output:
              reason: "OPERATOR_DECLINED"

      # ── terminal states ─────────────────────────────────────────────
      done:
        terminal: true
        description: Granted and live. `connection_name` names the connection.
        onEnter:
          executor: { kind: noop }
          output:
            wired: true
            connection_name: "$.context.name"
            reason: null

      failed:
        terminal: true
        description: >
          Provisioning did not complete. `context.reason` carries the typed
          cause (UNKNOWN_TRUST_TIER | COMMUNITY_DECLINED | INSTALL_FAILED |
          BUILD_FAILED | BUILD_RECIPE_UNAVAILABLE | STAGE_FAILED |
          VALIDATION_FAILED | GRANT_FAILED | OPERATOR_DECLINED). A build-script
          fail-fast (`BUILD_REQUIRES_PINNED_IMAGE` — unpinned docker image;
          `BUILD_RECIPE_UNAVAILABLE` — rest-with-requires) surfaces its typed
          marker on stderr and routes here as `BUILD_FAILED`.
