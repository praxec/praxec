# flow.tools.provision — Phase 2 of the MCP tool lifecycle
# (docs/design/2026-07-30-mcp-tool-lifecycle-phase2.md §3).
#
# Provisions a discovered `ToolCandidate` (Phase 1 `tool_catalog`) into a
# live praxec connection by COMPOSING praxec's own connection-governance
# CLI — it never writes `connections:` / `stagedConnections:` YAML itself:
#
#   staging  → `praxec connections add`   (STAGE: writes an inert, ungranted
#                                          connection body)
#   granting → `praxec connections grant` (GRANT: the separate, explicit,
#                                          auditable operator trust act)
#
# select → trust_gate → installing → collecting → building → staging
#        → validating → granting → done | failed
#
# ── The env-wiring gap (P2.3b) — CLOSED, here's exactly how ─────────────
# `staging` used to template only the CONNECTION IDENTITY (name / kind /
# command-or-url) from the candidate — never the elicited secrets/config —
# because a `kind: cli` step's `args:` is a STATIC JSON array (see
# `crates/praxec-executors/src/cli.rs` + `arg_render.rs`): each element
# resolves to exactly ONE argv token via a whole-value path read or a
# literal, with no loop/spread construct to expand one array-valued
# context field (`candidate.requires.secrets`, arbitrary length) into N
# repeated `--env NAME=VALUE` tokens. That grammar limit is real and
# still true — it's just no longer the blocker, because the fix does not
# route through repeated flags at all:
#
#   1. `building` (new) runs a `kind: script` step (`build.connection-body`,
#      below) that reads `secretEnvNames`/`collectedConfig` — both
#      ARBITRARY-length JSON, not CLI argv — and emits ONE JSON object:
#      the full connection body, `env:`/`required_secrets:` included. This
#      needed a real code component (jq) — `arg_render.rs`'s whole-path
#      reads and the guard/output-mapping operators have no loop/length()
#      construct either, so the arity problem genuinely can't be solved
#      declaratively (confirmed while building this).
#   2. That body lands in ONE context slot (`built_body`) as a JSON object
#      — `render_arg`'s whole-value-path fallback (`other.to_string()`)
#      compact-serializes an object-valued context field to a single argv
#      token, so `staging` passes the WHOLE body as one templated
#      `--block` token to `connections add --block` (P2.3b's new CLI
#      flag — see `crates/praxec-executors/src/conn_write.rs`).
#
# Collected values are wired as TWO different kinds, deliberately:
#   - `collectedConfig` (non-secret) → literal `env:` entries. Safe to put
#     in the config: the operator already typed these into the elicitation
#     form and they carry no secret material.
#   - `secretEnvNames[].envVar` (secret) → `required_secrets:` NAMES only,
#     never values. This is NOT a templating shortcut — it's how connection
#     secrets ACTUALLY resolve in this codebase: `std::process::Command`
#     inherits the current process environment by default (see
#     `crates/praxec-executors/src/cli.rs`/`mcp.rs`), so a spawned child
#     already sees whatever the operator exported in their own shell before
#     running `praxec`; `required_secrets:` is a pure DECLARATION that lets
#     `praxec doctor`/preflight report a missing one (advisory — see
#     `crates/praxec/src/preflight.rs`). Writing the secret's actual VALUE
#     (or a `"$NAME"`-style placeholder string) into `env:` would be
#     actively wrong: `cmd.env(k, v)` sets that key VERBATIM on the child,
#     which would SHADOW the correctly-inherited real secret with a literal
#     placeholder string instead of resolving it.
#   - This is P2.1's `required_secrets` field; it was already read by
#     `preflight.rs`/`doctor` but, until this change, absent from
#     `schemas/gateway-config.schema.json`'s `mcpConnection` def
#     (`additionalProperties: false` with no such property) — so granting
#     a connection that declared it always failed `INVALID_STAGED_CONNECTION`
#     schema validation. That schema gap is what this program closed; see
#     the `required_secrets` entry added there.
#
# Candidates with empty `requires` (the common case — see
# `crates/praxec-core/src/tool_catalog/candidate.rs`'s own doc comment)
# provision exactly as before: `built_body` just has no `env:`/
# `required_secrets:` keys.
#
# Transport coverage is deliberately the three the design doc names
# (`stdio→mcp+command`, `remote→mcp+url`, `rest→rest`); anything else
# (e.g. `docker`) fails fast at `installing`/`building` with a typed
# `*_RECIPE_UNAVAILABLE` reason rather than silently no-opping — extend
# the guarded transitions below to add a transport.

# Lexicon entry for the one script subject this workflow defines (SPEC §30.10.4).
lexicon:
  build.connection-body:
    definition_short: >
      Assemble a staged connection's full JSON body (kind, identity,
      env:/required_secrets:) from a candidate + operator-collected values.

scripts:
  build.connection-body:
    verb: build
    lifecycle: stable
    body: |
      #!/usr/bin/env bash
      set -euo pipefail

      transport="$1"
      npm_pkg="$2"
      source_url="$3"
      secret_env_names_json="$4"
      collected_config_json="$5"

      # `secretEnvNames` is `[{name, envVar}, ...]` (P2.3b's `collecting`
      # output) — only the envVar NAMES are needed here, never a value.
      required_secrets=$(echo "$secret_env_names_json" | jq -c '[ .[].envVar ]')

      # `restConnection`'s schema has no `env:` (or `required_secrets:`)
      # property — only `mcpConnection` gained `required_secrets:` (P2.3b).
      # A rest-transport candidate that actually declared `requires` has
      # nowhere safe to put the collected values today (its secret/config
      # would need to land in `headers:`, a different, un-elicited-for-here
      # mechanism) — fail fast rather than silently dropping them.
      has_requires=$(jq -n --argjson secrets "$required_secrets" --argjson cfg "$collected_config_json" \
        '($secrets|length) > 0 or ($cfg|length) > 0')

      case "$transport" in
        stdio)
          jq -nc \
            --arg pkg "$npm_pkg" \
            --argjson secrets "$required_secrets" \
            --argjson cfg "$collected_config_json" \
            '{kind:"mcp", command:"npx", args:["-y",$pkg]}
             + (if ($cfg|length) > 0 then {env:($cfg | with_entries(.value |= tostring))} else {} end)
             + (if ($secrets|length) > 0 then {required_secrets:$secrets} else {} end)'
          ;;
        remote)
          jq -nc \
            --arg url "$source_url" \
            --argjson secrets "$required_secrets" \
            --argjson cfg "$collected_config_json" \
            '{kind:"mcp", url:$url}
             + (if ($cfg|length) > 0 then {env:($cfg | with_entries(.value |= tostring))} else {} end)
             + (if ($secrets|length) > 0 then {required_secrets:$secrets} else {} end)'
          ;;
        rest)
          if [ "$has_requires" = "true" ]; then
            echo "BUILD_RECIPE_UNAVAILABLE: rest transport has no env:/required_secrets: analog — this candidate declared requires.secrets/requires.config, which this reference workflow cannot wire for a rest connection" >&2
            exit 1
          fi
          jq -nc --arg url "$source_url" '{kind:"rest", baseUrl:$url}'
          ;;
        *)
          # Dead code today — `building`'s guards route stdio/remote/rest
          # before this script ever runs; kept as a defensive fail-fast in
          # case a future guard change lets an unhandled transport through.
          echo "BUILD_RECIPE_UNAVAILABLE: unsupported transport '$transport'" >&2
          exit 1
          ;;
      esac

workflows:
  flow.tools.provision:
    description: >
      Provision a discovered MCP tool candidate into a live connection via
      the existing `connections add` (stage) → `connections grant`
      (operator trust act) CLI — the trusted lane only (verified/org);
      community candidates are refused (Phase 3 territory).
    tags: [tool-lifecycle, governed, phase2]

    inputSchema:
      type: object
      required: [candidate, config_path]
      additionalProperties: false
      properties:
        candidate:
          type: object
          description: A `ToolCandidate` (Phase 1 `tool_catalog`) — by value.
          required: [name, transport, source, trust_tier]
          additionalProperties: false
          properties:
            name: { type: string }
            description: { type: string, default: "" }
            transport:
              type: string
              enum: [stdio, docker, remote, rest]
            source:
              type: object
              description: >
                The `ToolSource` tagged union, e.g. `{ npm: { pkg: "..." } }`
                or `{ url: { url: "..." } }`. Kept loose here (Phase 1's
                type is the source of truth); the states below read only
                the shapes they support.
            verbs: { type: array, items: { type: string }, default: [] }
            tags: { type: array, items: { type: string }, default: [] }
            trust_tier:
              type: string
              enum: [community, org, verified]
            requires:
              type: object
              default: { secrets: [], config: [] }
              additionalProperties: false
              properties:
                secrets:
                  type: array
                  default: []
                  items:
                    type: object
                    required: [name, description]
                    properties:
                      name: { type: string }
                      description: { type: string }
                config:
                  type: array
                  default: []
                  items:
                    type: object
                    required: [name, description]
                    properties:
                      name: { type: string }
                      description: { type: string }
            provenance: { type: string, default: "" }
        config_path:
          type: string
          description: The gateway YAML config to stage/grant the connection into.

    initialState: select

    # Every field any state's output touches is seeded here — no state's
    # first read of a slot is ever an unset-context-slot guard error.
    initialContext:
      candidate: null
      name: null
      transport: null
      trust_tier: null
      secrets_required: []
      config_required: []
      config_path: null
      npmPkg: null
      sourceUrl: null
      secretEnvNames: []
      collectedConfig: {}
      secrets_set: []
      installExitCode: null
      installSuccess: null
      built_body: null
      buildExitCode: null
      buildSuccess: null
      stageExitCode: null
      stageSuccess: null
      doctorExitCode: null
      doctorSuccess: null
      doctorStdout: null
      grantExitCode: null
      grantSuccess: null
      connection_name: null
      wired: false
      reason: null

    states:

      # ── select ──────────────────────────────────────────────────────
      select:
        description: >
          Resolve/normalize the input candidate into the flat fields the
          later states read. Pure data projection (`kind: noop` executor)
          — every read here is null-safe (output-mapping path reads
          coalesce to `null` when the candidate's `source` variant doesn't
          have that shape), so branching on the result is never a guard
          crash.
        onEnter:
          executor: { kind: noop }
          output:
            candidate:        "$.workflow.input.candidate"
            name:             "$.workflow.input.candidate.name"
            transport:        "$.workflow.input.candidate.transport"
            trust_tier:       "$.workflow.input.candidate.trust_tier"
            secrets_required: "$.workflow.input.candidate.requires.secrets"
            config_required:  "$.workflow.input.candidate.requires.config"
            config_path:      "$.workflow.input.config_path"
            # Source-variant projections — null unless that variant is
            # actually present (see the header note on why this is safe).
            npmPkg:    "$.workflow.input.candidate.source.npm.pkg"
            sourceUrl: "$.workflow.input.candidate.source.url.url"
        transitions:
          resolved:
            title: Candidate resolved — evaluate trust tier.
            target: trust_gate

      # ── trust_gate ──────────────────────────────────────────────────
      trust_gate:
        description: >
          Split gate on `trust_tier`. Exhaustive over the closed
          `TrustTier` set (community/org/verified) rather than one
          unguarded catch-all transition, so `linkFilter: byGuards` never
          shows two simultaneously-legal outcomes.
        linkFilter: byGuards
        transitions:
          # `proceed_verified`/`proceed_org` are split into two flat-guard
          # transitions (rather than one `any_of`) so each is independently
          # coverable by `praxec fuzz`'s satisfier, which only derives a
          # satisfying value for a top-level `expr` guard, not a composite
          # `any_of`/`all_of`/`not` — same reason as `expense-approval`'s
          # permission-guarded edges show as uncoverable there.
          proceed_verified:
            title: Verified tier — proceed to install.
            target: installing
            guards:
              - { kind: expr, expr: "$.context.trust_tier == 'verified'" }

          proceed_org:
            title: Org tier — proceed to install.
            target: installing
            guards:
              - { kind: expr, expr: "$.context.trust_tier == 'org'" }

          reject_community:
            title: Community tier needs Phase 3 (sandboxed) provisioning.
            target: failed
            guards:
              - { kind: expr, expr: "$.context.trust_tier == 'community'" }
            output:
              reason: "COMMUNITY_REQUIRES_PHASE3"

          reject_unknown_tier:
            title: Unrecognized/unset trust tier — fail closed.
            target: failed
            guards:
              - kind: all_of
                guards:
                  - { kind: expr, expr: "$.context.trust_tier != 'verified'" }
                  - { kind: expr, expr: "$.context.trust_tier != 'org'" }
                  - { kind: expr, expr: "$.context.trust_tier != 'community'" }
            output:
              reason: "UNKNOWN_TRUST_TIER"

      # ── installing ──────────────────────────────────────────────────
      installing:
        description: >
          Run the candidate's install recipe, derived from
          transport/source. Bounded by `reliability.timeoutMs`; a non-zero
          exit is DATA here (`treatNonZeroAsFailure: false`) so the
          `branches` guard — not an executor error — decides the route,
          letting a real `INSTALL_FAILED` reason land in `failed`.
        linkFilter: byGuards
        transitions:
          install_npm:
            title: "Install: npx-distributed stdio server (npm install -g)."
            target: failed # fallback if the branch below doesn't match
            guards:
              - { kind: expr, expr: "$.context.transport == 'stdio'" }
              - { kind: expr, expr: "$.context.npmPkg != null" }
            executor:
              kind: cli
              connection: npm
              args: ["install", "-g", "$.context.npmPkg"]
              treatNonZeroAsFailure: false
            reliability:
              timeoutMs: 120000
            branches:
              - when: { kind: expr, expr: "$.context.installSuccess == true" }
                target: collecting
            output:
              installExitCode: "$.output.exitCode"
              installSuccess:  "$.output.success"
              reason: "INSTALL_FAILED"

          install_not_needed_remote:
            title: "Install: remote transport needs nothing installed."
            target: collecting
            guards:
              - { kind: expr, expr: "$.context.transport == 'remote'" }
            executor: { kind: noop }
            output:
              installSuccess: true

          install_not_needed_rest:
            title: "Install: rest transport needs nothing installed."
            target: collecting
            guards:
              - { kind: expr, expr: "$.context.transport == 'rest'" }
            executor: { kind: noop }
            output:
              installSuccess: true

          install_unsupported:
            title: No install recipe for this transport/source combination.
            target: failed
            guards:
              - kind: all_of
                guards:
                  - kind: not
                    guard:
                      kind: all_of
                      guards:
                        - { kind: expr, expr: "$.context.transport == 'stdio'" }
                        - { kind: expr, expr: "$.context.npmPkg != null" }
                  - kind: not
                    guard:
                      kind: any_of
                      guards:
                        - { kind: expr, expr: "$.context.transport == 'remote'" }
                        - { kind: expr, expr: "$.context.transport == 'rest'" }
            output:
              reason: "INSTALL_RECIPE_UNAVAILABLE"

      # ── collecting ──────────────────────────────────────────────────
      collecting:
        description: >
          Elicit `candidate.requires.secrets` + `requires.config` from the
          operator. Secrets are recorded as env-var NAMES the operator has
          already set in `providers.env` — never values — so no secret
          material ever reaches this workflow's context or audit trail.
          Arbitrary-length lists are fine here: this is JSON data capture,
          not CLI argv (see the header note on why `staging` can't turn
          this into repeated `--env` flags today).
        transitions:
          # NOTE: `praxec check` warns ELICITATION_INCOMPATIBLE_GATE here
          # (V36) — `secretEnvNames`/`config` are non-primitive, so a
          # chat-style push-elicitation UI could never fill this form. That
          # is the intended shape: this is a PULL-ONLY gate (V36 explicitly
          # allows it — "pull-only object gates are legitimate"), resolved
          # by the operator submitting the full JSON directly (`command
          # submit` / `approvals resolve`), not by a primitives-only push
          # form. `choices:` doesn't fit — there is no finite pick-list;
          # the operator is naming arbitrary env-var mappings.
          submit_collection:
            title: Submit the operator's secret-name / config mapping.
            actor: human
            target: building
            executor:
              kind: human
              queue: tool-provision-collect
            inputSchema:
              type: object
              required: [secretEnvNames, config]
              additionalProperties: false
              properties:
                secretEnvNames:
                  type: array
                  default: []
                  description: >
                    One entry per `candidate.requires.secrets` item: which
                    env-var NAME (already set in `providers.env`) backs it.
                  items:
                    type: object
                    required: [name, envVar]
                    additionalProperties: false
                    properties:
                      name:   { type: string, description: "requires.secrets[].name this answers." }
                      envVar: { type: string, description: "The env-var NAME in providers.env (never its value)." }
                config:
                  type: object
                  default: {}
                  description: Values for `candidate.requires.config` fields.
            output:
              secretEnvNames:  "$.arguments.secretEnvNames"
              collectedConfig: "$.arguments.config"
              secrets_set:     "$.arguments.secretEnvNames[*].envVar"

      # ── building ────────────────────────────────────────────────────
      building:
        description: >
          P2.3b — build the FULL staged-connection body (identity +
          `env:`/`required_secrets:`) in one `kind: script` step, from the
          candidate's transport/source AND the operator's collected
          secrets/config — see the header note for why this needed a real
          code component and why secrets land as `required_secrets:` names
          rather than `env:` values. A non-zero exit is data
          (`treatNonZeroAsFailure: false`); `branches` decides the route so
          `BUILD_FAILED` lands correctly in `failed`. The
          transport/source-availability guards mirror `installing`'s —
          checked BEFORE spawning anything, so an unsupported combination
          never reaches the script at all.
        linkFilter: byGuards
        transitions:
          build_stdio_mcp:
            title: "Build: stdio mcp connection body (npx-distributed server)."
            target: failed
            guards:
              - { kind: expr, expr: "$.context.transport == 'stdio'" }
              - { kind: expr, expr: "$.context.npmPkg != null" }
            executor:
              kind: script
              subject: build.connection-body
              args:
                - "stdio"
                - "$.context.npmPkg"
                - "$.context.sourceUrl"
                - "$.context.secretEnvNames"
                - "$.context.collectedConfig"
              treatNonZeroAsFailure: false
            branches:
              - when: { kind: expr, expr: "$.context.buildSuccess == true" }
                target: staging
            output:
              buildExitCode: "$.output.exitCode"
              buildSuccess:  "$.output.success"
              built_body:    "$.output.json"
              reason: "BUILD_FAILED"

          build_remote_mcp:
            title: "Build: remote (streamable-http) mcp connection body."
            target: failed
            guards:
              - { kind: expr, expr: "$.context.transport == 'remote'" }
              - { kind: expr, expr: "$.context.sourceUrl != null" }
            executor:
              kind: script
              subject: build.connection-body
              args:
                - "remote"
                - "$.context.npmPkg"
                - "$.context.sourceUrl"
                - "$.context.secretEnvNames"
                - "$.context.collectedConfig"
              treatNonZeroAsFailure: false
            branches:
              - when: { kind: expr, expr: "$.context.buildSuccess == true" }
                target: staging
            output:
              buildExitCode: "$.output.exitCode"
              buildSuccess:  "$.output.success"
              built_body:    "$.output.json"
              reason: "BUILD_FAILED"

          build_rest:
            title: "Build: rest connection body."
            target: failed
            guards:
              - { kind: expr, expr: "$.context.transport == 'rest'" }
              - { kind: expr, expr: "$.context.sourceUrl != null" }
            executor:
              kind: script
              subject: build.connection-body
              args:
                - "rest"
                - "$.context.npmPkg"
                - "$.context.sourceUrl"
                - "$.context.secretEnvNames"
                - "$.context.collectedConfig"
              treatNonZeroAsFailure: false
            branches:
              - when: { kind: expr, expr: "$.context.buildSuccess == true" }
                target: staging
            output:
              buildExitCode: "$.output.exitCode"
              buildSuccess:  "$.output.success"
              built_body:    "$.output.json"
              reason: "BUILD_FAILED"

          build_unsupported:
            title: No build recipe for this transport/source combination.
            target: failed
            guards:
              - kind: all_of
                guards:
                  - kind: not
                    guard:
                      kind: all_of
                      guards:
                        - { kind: expr, expr: "$.context.transport == 'stdio'" }
                        - { kind: expr, expr: "$.context.npmPkg != null" }
                  - kind: not
                    guard:
                      kind: all_of
                      guards:
                        - { kind: expr, expr: "$.context.transport == 'remote'" }
                        - { kind: expr, expr: "$.context.sourceUrl != null" }
                  - kind: not
                    guard:
                      kind: all_of
                      guards:
                        - { kind: expr, expr: "$.context.transport == 'rest'" }
                        - { kind: expr, expr: "$.context.sourceUrl != null" }
            output:
              reason: "BUILD_RECIPE_UNAVAILABLE"

      # ── staging ─────────────────────────────────────────────────────
      staging:
        description: >
          Stage the connection (inert, ungranted) via `praxec connections
          add --block`: `built_body` already carries the resolved `kind`
          (mcp/rest) and every field, so ONE ungated transition covers all
          transports — no more per-kind duplication. A non-zero exit is
          data (`treatNonZeroAsFailure: false`); `branches` decides the
          route so `STAGE_FAILED` lands correctly in `failed`.
        transitions:
          stage_connection:
            title: "Stage: `connections add --block` with the built body."
            target: failed
            executor:
              kind: cli
              connection: praxec
              args:
                - "connections"
                - "add"
                - "--config"
                - "$.context.config_path"
                - "--name"
                - "$.context.name"
                - "--block"
                - "$.context.built_body"
              treatNonZeroAsFailure: false
            branches:
              - when: { kind: expr, expr: "$.context.stageSuccess == true" }
                target: validating
            output:
              stageExitCode: "$.output.exitCode"
              stageSuccess:  "$.output.success"
              reason: "STAGE_FAILED"

      # ── validating ──────────────────────────────────────────────────
      validating:
        description: >
          Doctor-check the staged connection (P2.1's `required_secrets`
          check) BEFORE anything is granted — the poka-yoke: a tool never
          reaches the live registry until its secrets resolve.
        transitions:
          validate:
            title: Run `praxec doctor` against the staged connection.
            target: failed
            executor:
              kind: cli
              connection: praxec
              args: ["doctor", "--config", "$.context.config_path"]
              treatNonZeroAsFailure: false
            reliability:
              timeoutMs: 30000
            branches:
              - when: { kind: expr, expr: "$.context.doctorSuccess == true" }
                target: granting
            output:
              doctorExitCode: "$.output.exitCode"
              doctorSuccess:  "$.output.success"
              doctorStdout:   "$.output.stdout"
              reason: "VALIDATION_FAILED"

      # ── granting ────────────────────────────────────────────────────
      granting:
        description: >
          THE operator trust act: `praxec connections grant`. This is a
          human gate — in a headless drive it parks for the operator
          exactly like any other `actor: human` transition; approving it
          here IS the proven-human origin, so the composed CLI call passes
          `--yes` (a non-interactive grant is otherwise refused fail-closed
          with `GRANT_REQUIRES_OPERATOR` — see `gateway.rs`). Declining
          never invokes the CLI at all — nothing is granted.
        linkFilter: byGuards
        transitions:
          approve_grant:
            title: Approve — grant the staged connection.
            actor: human
            target: failed
            guards:
              - { kind: permission, permission: workflow.approve }
            executor:
              kind: cli
              connection: praxec
              args:
                - "connections"
                - "grant"
                - "--config"
                - "$.context.config_path"
                - "$.context.name"
                - "--yes"
              treatNonZeroAsFailure: false
            branches:
              - when: { kind: expr, expr: "$.context.grantSuccess == true" }
                target: done
            output:
              grantExitCode: "$.output.exitCode"
              grantSuccess:  "$.output.success"
              reason: "GRANT_FAILED"

          decline_grant:
            title: Decline — do not grant. Nothing is wired.
            actor: human
            target: failed
            guards:
              - { kind: permission, permission: workflow.approve }
            output:
              reason: "OPERATOR_DECLINED"

      # ── terminal states ─────────────────────────────────────────────
      done:
        terminal: true
        description: Granted and live. `connection_name` names the connection.
        onEnter:
          executor: { kind: noop }
          output:
            wired: true
            connection_name: "$.context.name"
            reason: null

      failed:
        terminal: true
        description: >
