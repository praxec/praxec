# MCP tool discovery (Phase 1 + Phase 3 registry adapters) —
# docs/design/plans/2026-07-30-mcp-tool-discovery-phase1.md
#
# A minimal config demonstrating the `registries:` block: `github-org` and
# `static` (Phase 1), plus the Phase-3 `rest` and `mcp-registry` adapters
# below (commented out — they'd hit real network on `query`, which this
# example doesn't exercise). Phase 1/3 are read-only: nothing here installs
# or provisions anything.
#
# Try it:
#   praxec check --config examples/tool-discovery/gateway.yaml
#   praxec query --config examples/tool-discovery/gateway.yaml '{"discover":"browser"}'
#   praxec query --config examples/tool-discovery/gateway.yaml '{"evaluate":{"verbs":["diagnose"]}}'
#
# The `github-org` entry is best-effort: if the network is unreachable or the
# org can't be resolved, `assemble` downgrades it to a warning (surfaced in
# the response's `warnings` array) rather than failing the query — the
# `static` candidate below still lands either way. Same fail-safe behavior
# applies to `rest` and `mcp-registry`.
version: "1.0.0"

# This example only exercises `praxec.query { discover }` / `{ evaluate }` —
# it never starts a workflow, so ephemeral (in-memory/stderr) storage is fine
# for `praxec check` / `praxec query`. `serve` would still refuse to run it
# durably without this override.
gateway:
  allow_ephemeral: true

registries:
  - kind: github-org
    name: praxec-org
    org: praxec

  - kind: static
    name: local
    candidates:
      - name: browser-mcp
        description: Playwright-backed browser automation MCP server.
        transport: stdio
        source:
          npm:
            pkg: "@playwright/mcp"
        verbs: [diagnose]
        tags: [browser, e2e]
        trust_tier: verified
        provenance: local

  # Phase 3 — generic `rest` adapter: any endpoint serving a JSON array in
  # the normalized shape documented in
  # crates/praxec-core/src/tool_catalog/adapters/rest.rs. Uncomment + point
  # `url` at a real endpoint to use it.
  # - kind: rest
  #   name: acme-rest
  #   url: https://tools.acme.dev/registry.json

  # Phase 3 — Official MCP Registry adapter. `url` is optional; it defaults
  # to the registry's `v0` servers endpoint (see `DEFAULT_MCP_REGISTRY_URL`
  # in crates/praxec-core/src/tool_catalog/adapters/mcp_registry.rs).
  # - kind: mcp-registry
  #   name: official
