version: 1
# THE single source of truth for praxec's default model routing. Embedded into
# both the TUI `seed`/`migrate` output (praxec-tui) and the `praxec init` scaffold
# (praxec) via praxec_core::seed_models::SEED_MODELS_YAML — update models HERE, in
# one place, and both consumers follow.
#
# Commodity-first, specialist-per-activity seed (educated guesses from the model
# catalog's scores). Leads are un-pinned OpenRouter rolling "-latest" aliases so a
# shifting model ecosystem is absorbed without re-pinning: the alias always points
# at the vendor's newest build (verified on OpenRouter 2026-09-15). The `~vendor/…`
# ids are QUOTED because a leading `~` is YAML's null indicator when bare. Every
# commodity lead is < $5/M output, so the WS2 cost gate is inert for them; frontier
# is opt-in via the *-frontier overrides + gateway.cost.approve_frontier. These are
# PRIORS — the de-escalation flywheel tunes them from real acceptance evidence.
#
# NOTE: moonshotai/kimi-k2.6 and qwen/qwen3-coder were retired from OpenRouter
# (2026-09-15), so glm-latest — now the strongest commodity model on coding and
# agentic — leads those chains, with deepseek-pro-latest as the cheap capable
# backup.

# General chain (auto_drive default): cheapest capable reasoner first.
default:
  - { provider: { name: openrouter }, model: "~z-ai/glm-latest", effort: high }
  - { provider: { name: openrouter }, model: "~deepseek/deepseek-pro-latest", effort: high }
  - { provider: { name: openrouter }, model: "~deepseek/deepseek-flash-latest", effort: high }

activity:
  # Coding — glm-latest tops commodity coding (59) since qwen3-coder's retirement;
  # medium effort (coding doesn't need heavy reasoning). Cheap reasoner backs it up.
  coding:
    - { provider: { name: openrouter }, model: "~z-ai/glm-latest", effort: medium }
    - { provider: { name: openrouter }, model: "~deepseek/deepseek-pro-latest", effort: high }
  # Review — glm @ high won the WS4 adversarial-review trial; review leads with the
  # empirical winner's rolling alias, cheap reasoner backs it up.
  review:
    - { provider: { name: openrouter }, model: "~z-ai/glm-latest", effort: high }
    - { provider: { name: openrouter }, model: "~deepseek/deepseek-pro-latest", effort: high }
  # Agentic / tool-loop — glm-latest tops commodity agentic (57) after kimi's
  # retirement. The purpose-built long-horizon agentic flagship (gpt-astra) is
  # available as opt-in frontier below.
  agentic:
    - { provider: { name: openrouter }, model: "~z-ai/glm-latest", effort: high }
    - { provider: { name: openrouter }, model: "~deepseek/deepseek-pro-latest", effort: high }
  # Prose / content writing — FRONTIER by policy: all content writing runs on a
  # frontier Anthropic model. These are over $5/M, so prose steps FAIL FAST
  # (FRONTIER_NOT_APPROVED) until the operator adds the model to
  # gateway.cost.approve_frontier — a deliberate quality-over-cost choice for copy.
  prose:
    - { provider: { name: openrouter }, model: "~anthropic/claude-sonnet-latest", effort: low }
    - { provider: { name: openrouter }, model: "~anthropic/claude-opus-latest", effort: low }

overrides:
  # Reasoning affinity — deepseek-pro-latest is the cheapest capable reasoner
  # (catalog reasoning 57 @ $1.98/M out); let the flywheel raise to glm if it fails.
  reasoning:
    - { provider: { name: openrouter }, model: "~deepseek/deepseek-pro-latest", effort: high }
    - { provider: { name: openrouter }, model: "~z-ai/glm-latest", effort: high }
  # Frontier escalation tiers — OPT-IN. These over-$5/M models fail fast
  # (FRONTIER_NOT_APPROVED) unless added to gateway.cost.approve_frontier, so a
  # human must deliberately approve frontier spend. Frontier lives at the tail.
  coding-frontier:
    - { provider: { name: openrouter }, model: "~anthropic/claude-sonnet-latest" }
    - { provider: { name: openrouter }, model: "~openai/gpt-sol-latest" }
  reasoning-frontier:
    - { provider: { name: openrouter }, model: "~anthropic/claude-opus-latest" }
    - { provider: { name: openrouter }, model: "~openai/gpt-astra-latest" }
